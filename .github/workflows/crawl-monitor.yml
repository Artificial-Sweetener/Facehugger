name: Crawl health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: facehugger-crawl-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check active crawl and durable progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_run="$(gh run list --workflow crawl.yml --limit 1 --json status --jq '.[0].status')"
          if test "$latest_run" = "in_progress" || test "$latest_run" = "queued"; then
            echo "A crawl is already active."
            exit 0
          fi

          mkdir -p reports
          gh release download full-crawl-state --pattern full-crawl.json --dir reports || true
          if test ! -f reports/full-crawl.json; then
            echo "No durable crawl checkpoint is available; starting a crawl."
            gh workflow run crawl.yml --ref main
            exit 0
          fi

          if jq -e '.next_invocation_ready == true' reports/full-crawl.json >/dev/null; then
            echo "The durable checkpoint is incomplete; starting the next crawl."
            gh workflow run crawl.yml --ref main
          else
            echo "The durable checkpoint is complete."
          fi
