name: Full crawl

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/publish-crawl-badges/**
      - .github/workflows/crawl.yml
      - pyproject.toml
      - src/facehugger/**
      - uv.lock
  workflow_dispatch:
    inputs:
      inspection_limit:
        description: Maximum changed repositories to inspect in this bounded invocation
        required: false
        default: "25000"
        type: string
      catalog_page_limit:
        description: Maximum model-catalog pages to enumerate in this bounded invocation
        required: false
        default: "1000"
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: facehugger-state
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - name: Restore durable crawler state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .facehugger
          gh release download full-crawl-state --pattern full.sqlite.zst --pattern full.sqlite.zst.sha256 --dir .facehugger || true
          test ! -f .facehugger/full.sqlite.zst || (cd .facehugger && sha256sum --check full.sqlite.zst.sha256)
          test ! -f .facehugger/full.sqlite.zst || zstd --quiet --decompress --force .facehugger/full.sqlite.zst -o .facehugger/full.sqlite
      - name: Mark crawl as running
        run: uv run facehugger crawl-status --root . --status running
      - name: Publish README badge data
        if: always() && hashFiles('reports/full-crawl-*-badge.json') != ''
        uses: ./.github/actions/publish-crawl-badges
        with:
          github-token: ${{ github.token }}
      - id: crawl
        name: Advance resumable full crawl
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INDEX_VERSION: full-${{ github.run_id }}
        run: |
          uv run facehugger crawl --root . --version "$INDEX_VERSION" --catalog-page-limit "${{ inputs.catalog_page_limit || '1000' }}" --inspection-limit "${{ inputs.inspection_limit || '25000' }}" | tee crawl-output.json
          echo "published=$(jq -r '.published' crawl-output.json)" >> "$GITHUB_OUTPUT"
          echo "continue=$(jq -r '.next_invocation_ready' crawl-output.json)" >> "$GITHUB_OUTPUT"
      - name: Mark crawl as failed
        if: failure() || cancelled()
        run: uv run facehugger crawl-status --root . --status failed
      - name: Package durable crawler state
        if: always() && hashFiles('.facehugger/full.sqlite') != ''
        run: |
          zstd --quiet --force .facehugger/full.sqlite -o .facehugger/full.sqlite.zst
          (cd .facehugger && sha256sum full.sqlite.zst > full.sqlite.zst.sha256)
          test "$(stat --printf='%s' .facehugger/full.sqlite.zst)" -le 1900000000
      - name: Publish durable crawler state and progress
        if: always() && hashFiles('.facehugger/full.sqlite.zst') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create full-crawl-state --prerelease --title "Full crawl state" --notes "Durable resumable crawler state." || true
          assets=(.facehugger/full.sqlite.zst .facehugger/full.sqlite.zst.sha256)
          for report in reports/full-crawl.json reports/full-crawl-*-badge.json; do
            test ! -f "$report" || assets+=("$report")
          done
          gh release upload full-crawl-state "${assets[@]}" --clobber
      - name: Publish completed README badge data
        if: always() && hashFiles('reports/full-crawl-*-badge.json') != ''
        uses: ./.github/actions/publish-crawl-badges
        with:
          github-token: ${{ github.token }}
      - name: Queue next incomplete crawl
        if: success() && steps.crawl.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run crawl.yml --ref "$GITHUB_SHA" --field catalog_page_limit="${{ inputs.catalog_page_limit || '1000' }}" --field inspection_limit="${{ inputs.inspection_limit || '25000' }}"
      - uses: actions/upload-pages-artifact@v3
        if: steps.crawl.outputs.published == 'true'
        with:
          path: site-staging
      - id: deployment
        if: steps.crawl.outputs.published == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify completed publication
        if: steps.crawl.outputs.published == 'true'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --show-error --location --head "$PAGES_URL/api/v1/manifest.json"
